<title>المِرْتَال</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Spectral:ital,wght@0,300;0,400;0,600;1,300&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDEEEA; --panel:#F6F7F4; --edge:#DCDFD8; --edge2:#E6E9E2;
  --ink:#12161A; --ink2:#4C5560; --ink3:#7C8691;
  --nassi:#14606D; --nassi-bg:#14606D15;
  --manqul:#5B4A8A; --manqul-bg:#5B4A8A15;
  --idraki:#8E5E1B; --idraki-bg:#8E5E1B15;
  --brass:#96762F;
  --glow:transparent;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C0F15; --panel:#131820; --edge:#222932; --edge2:#1A1F27;
    --ink:#E8EBEF; --ink2:#98A3B0; --ink3:#68727E;
    --nassi:#5FC0CD; --nassi-bg:#5FC0CD1C;
    --manqul:#A896D8; --manqul-bg:#A896D81C;
    --idraki:#DCA85C; --idraki-bg:#DCA85C1C;
    --brass:#C9A85C;
    --glow:#5FC0CD12;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0F15; --panel:#131820; --edge:#222932; --edge2:#1A1F27;
  --ink:#E8EBEF; --ink2:#98A3B0; --ink3:#68727E;
  --nassi:#5FC0CD; --nassi-bg:#5FC0CD1C;
  --manqul:#A896D8; --manqul-bg:#A896D81C;
  --idraki:#DCA85C; --idraki-bg:#DCA85C1C;
  --brass:#C9A85C; --glow:#5FC0CD12;
}
*{box-sizing:border-box}
.meta>*,.edge>*,.anchor>*,.cit,.item>*,.whead>*{unicode-bidi:isolate}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:Spectral,Georgia,serif; font-weight:300; font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased}
.q{font-family:"Amiri Quran",Amiri,"Noto Naskh Arabic",serif; direction:rtl; line-height:2.0}
.ar{font-family:Amiri,"Noto Naskh Arabic",serif; direction:rtl}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
:focus-visible{outline:2px solid var(--nassi); outline-offset:2px}

/* ============ shell ============ */
.shell{max-width:1240px; margin:0 auto; padding:0 18px}
.top{display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding-block:20px 14px; border-bottom:1px solid var(--edge)}
.brand{display:flex; align-items:baseline; gap:11px; margin-inline-end:auto}
.brand h1{font-family:Amiri,serif; font-size:31px; font-weight:700; margin:0; direction:rtl;
  letter-spacing:.01em}
.brand .tr{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.19em;
  text-transform:uppercase; color:var(--brass)}
.tbtn{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink3); padding:6px 11px; border:1px solid var(--edge);
  border-radius:2px}
.tbtn:hover{color:var(--ink); border-color:var(--ink3)}
.tbtn[aria-pressed="true"]{color:var(--nassi); border-color:var(--nassi); background:var(--nassi-bg)}

/* ============ mode rail ============ */
.rail{display:flex; gap:1px; background:var(--edge2); border:1px solid var(--edge2);
  margin:18px 0 0; overflow-x:auto}
.rail button{background:var(--bg); padding:13px 17px; flex:1 1 auto; text-align:center;
  min-width:132px; border-bottom:2px solid transparent}
.rail button .a{font-family:Amiri,serif; font-size:20px; direction:rtl; display:block; line-height:1.5}
.rail button .e{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink3); display:block; margin-top:3px}
.rail button:hover{background:var(--panel)}
.rail button[aria-selected="true"]{background:var(--panel); border-bottom-color:var(--brass)}
.rail button[aria-selected="true"] .e{color:var(--brass)}

/* ============ two-pane ============ */
.panes{display:grid; grid-template-columns:288px 1fr; gap:0; min-height:60vh}
.list{border-inline-end:1px solid var(--edge); padding:16px 16px 60px 0; max-height:78vh;
  overflow-y:auto}
.stream{padding:18px 0 90px 26px; min-width:0}
@media (max-width:820px){
  .panes{grid-template-columns:1fr}
  .list{border-inline-end:none; border-bottom:1px solid var(--edge); max-height:230px;
    padding:14px 0 14px 0}
  .stream{padding:18px 0 90px 0}
}
.lhead{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--ink3); margin:0 0 11px}
.item{display:flex; align-items:baseline; gap:10px; width:100%; padding:8px 11px; text-align:start;
  border-inline-start:2px solid transparent; border-radius:0 2px 2px 0}
.item:hover{background:var(--panel)}
.item[aria-current="true"]{background:var(--panel); border-inline-start-color:var(--brass)}
.item .n{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink3);
  font-variant-numeric:tabular-nums; flex:none; min-width:22px}
.item .a{font-family:Amiri,serif; font-size:19px; direction:rtl; flex:1; min-width:0}
.item .m{font-family:"IBM Plex Mono",monospace; font-size:9.5px; color:var(--ink3); flex:none}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(126px,1fr)); gap:1px;
  background:var(--edge2)}

/* ============ stream head ============ */
.shead{border-bottom:1px solid var(--edge); padding-bottom:15px; margin-bottom:8px}
.shead h2{font-family:Amiri,serif; font-size:clamp(26px,5vw,38px); font-weight:700; margin:0;
  direction:rtl; line-height:1.35}
.shead .sub{font-size:14.5px; color:var(--ink2); margin:8px 0 0; max-width:62ch}
.shead .meta{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink3); margin:11px 0 0;
  display:flex; gap:14px; flex-wrap:wrap}

/* ============ furqān ============ */
.furqan{border-top:1px solid var(--edge2); padding:26px 0 6px; position:relative}
.furqan:first-of-type{border-top:none}
.fnum{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--brass); margin-bottom:9px}
.anchor{display:flex; align-items:baseline; gap:11px; flex-wrap:wrap; margin-bottom:6px}
.anchor .lbl{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink3)}
.anchor .t{font-family:"Amiri Quran",Amiri,serif; font-size:23px; direction:rtl;
  color:var(--ink); line-height:1.9}
.edges{display:flex; flex-direction:column; gap:5px; margin:11px 0 18px}
.edge{display:flex; align-items:center; gap:9px; flex-wrap:wrap; font-size:12.5px; color:var(--ink2)}
.edge .k{font-family:Amiri,serif; font-size:16px; direction:rtl}
.bits{font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-variant-numeric:tabular-nums;
  color:var(--ink3)}
.bar{height:3px; border-radius:1px; background:var(--nassi); flex:none}

/* ============ retlah ============ */
.retl{border-inline-start:2px solid var(--edge); padding:0 0 0 17px; margin:0 0 15px;
  position:relative}
.retl:hover{border-inline-start-color:var(--nassi)}
.retl .role{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink3); display:block; margin-bottom:4px}
.retl .line{font-size:clamp(21px,3.6vw,27px); margin-bottom:2px; color:var(--ink)}
.retl .cit{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--nassi);
  letter-spacing:.02em}
.retl.r-rujuu{border-inline-start-color:var(--brass)}
.retl.r-tawassu{border-inline-start-style:dashed}

/* ============ pills ============ */
.pill{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.06em;
  padding:2px 7px; border-radius:2px; white-space:nowrap; display:inline-block}
.p-n{background:var(--nassi-bg); color:var(--nassi)}
.p-m{background:var(--manqul-bg); color:var(--manqul)}
.p-i{background:var(--idraki-bg); color:var(--idraki)}

/* ============ reader (مجرى الرتل, surah view) ============ */
.reader{padding-top:6px}
.vrow{display:flex; gap:14px; align-items:flex-start; padding:11px 0;
  border-bottom:1px solid var(--edge2)}
.vnum{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink3); flex:none;
  min-width:34px; padding-top:11px; font-variant-numeric:tabular-nums}
.vtext{font-size:clamp(22px,4.2vw,30px); flex:1; min-width:0}
.wq{display:inline; color:var(--manqul); cursor:pointer; font:inherit;
  text-decoration:underline dotted var(--manqul); text-underline-offset:8px;
  text-decoration-thickness:1px; transition:background .12s}
.wq:hover,.wq:focus-visible{background:var(--manqul-bg); outline:none}

/* ============ waqf sheet ============ */
.sheet{position:fixed; inset:auto 0 0 0; background:var(--panel);
  border-top:1px solid var(--brass); max-height:82vh; overflow-y:auto; z-index:40;
  box-shadow:0 -18px 44px #0000002e}
.sheet .in{max-width:840px; margin:0 auto; padding:22px 20px 36px}
.sheet .x{position:absolute; inset-inline-end:14px; top:12px; font-size:22px; color:var(--ink3);
  line-height:1; padding:5px 9px}
.sheet .x:hover{color:var(--ink)}
.wmark{font-family:"Amiri Quran",Amiri,serif; font-size:40px; color:var(--manqul); line-height:1}
.whead{display:flex; align-items:center; gap:15px; margin-bottom:5px; flex-wrap:wrap}
.whead h3{font-family:Amiri,serif; font-size:26px; margin:0; direction:rtl; font-weight:700}
.wrule{font-size:14.5px; color:var(--ink2); margin:0 0 4px}
.attrib{font-size:13px; color:var(--ink3); border-top:1px solid var(--edge2);
  padding-top:13px; margin-top:19px}
.attrib b{color:var(--ink2); font-weight:600}

.note{font-size:13.5px; color:var(--ink3); border-top:1px solid var(--edge2);
  padding-top:14px; margin-top:26px}
.more{display:block; width:100%; text-align:center; padding:15px;
  border:1px dashed var(--edge); margin-top:26px; color:var(--ink3);
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase}
.more:hover{color:var(--nassi); border-color:var(--nassi)}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

<div class="shell">

  <div class="top">
    <div class="brand">
      <h1>المِرْتَال</h1>
      <span class="tr">al-Mirtāl · the instrument of tarteel</span>
    </div>
    <button class="tbtn" id="rasm" aria-pressed="false" title="Strip to the bare rasm — no dots, no vowels, no marks">الرَّسْم</button>
    <button class="tbtn" id="theme">◑</button>
  </div>

  <nav class="rail" role="tablist" id="rail"></nav>

  <div class="panes">
    <aside class="list" id="list"></aside>
    <main class="stream" id="stream"></main>
  </div>
</div>

<div class="sheet" id="sheet" hidden><button class="x" id="sheetx">×</button><div class="in" id="sheetin"></div></div>

<script id="bundle" type="application/json">__BUNDLE__</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('bundle').textContent);
const BAD = new Set(D.bad);

/* ---------- rasm: the codex layer, beneath every later apparatus ---------- */
const DIAC = /[ؐ-ًؚ-ٰٟۖ-ۭـ۝ࣰ-ࣿ]/g;
function toRasm(s){
  return s.replace(DIAC,'')
          .replace(/[آأإٱ]/g,'ا')
          .replace(/ى/g,'ي').replace(/ة/g,'ه')
          .replace(/۞|۩/g,'');
}
let RASM = false;
const sh = s => RASM ? toRasm(s) : s;
/* Inside a composition our own وقف governs, so an inherited mark is stripped from
   رتلة lines. It stays intact in the reader, where it is the object of study. */
const WQ_STRIP = /[ۖ-ۜ]/g;
const shc = s => RASM ? toRasm(s) : s.replace(WQ_STRIP,'');

/* ---------- text access: a رتلة is a citation sequence, rendered on demand ---------- */
function verse(s,a){ return (D.text[s-1]||[])[a-1] || ''; }
function words(s,a){ return verse(s,a).replace(/۞/g,'').split(/\s+/).filter(Boolean); }
function span(sp){
  const [s,a,w0,w1] = sp;
  if (BAD.has(s+':'+a)) return verse(s,a);
  const w = words(s,a);
  return w.slice(w0-1, w1).join(' ') || verse(s,a);
}
function cite(sp){ const [s,a,w0,w1]=sp; return s+':'+a+':'+w0+(w1>w0?'-'+w1:''); }
const retlText = r => r.map(span).join(' ');
const retlCite = r => '⟨'+r.map(cite).join(', ')+'⟩';

/* ---------- waqf: طبقة الوقف — a recorded مسار, typed منقول ---------- */
const WAQF = {
 'ۖ':{ar:'صَلَى — الوَصْلُ أَوْلَى', en:'Continuing is preferable',
   rule:'The marker judged that the sense carries across. Stopping is permitted but weakens the join.'},
 'ۗ':{ar:'قَلَى — الوَقْفُ أَوْلَى', en:'Stopping is preferable',
   rule:'The marker judged the clause complete here. Continuing is permitted but blurs the boundary.'},
 'ۘ':{ar:'مِيم — الوَقْفُ اللَّازِم', en:'Obligatory stop',
   rule:'The marker held that continuing would join what should not be joined.'},
 'ۙ':{ar:'لَا — لَا وَقْف', en:'Do not stop',
   rule:'The marker held that stopping here severs a governed relation.'},
 'ۚ':{ar:'جِيم — الوَقْفُ الجَائِز', en:'Permissible stop',
   rule:'The marker left it open. Either choice is sound; the reciter decides.'},
 'ۛ':{ar:'المُعَانَقَة — ثَلَاثُ نُقَط', en:'Embrace — stop at one, not both',
   rule:'Two marks, one choice. The phrase between them attaches either backward or forward, never both.'},
 'ۜ':{ar:'سِين — السَّكْتَة', en:'Brief silence, without breath',
   rule:'A held pause that does not release the breath, so the utterance is neither joined nor stopped.'}
};
const WQ_RE = /[ۖ-ۜ]/g;

/* ---------- rendering ---------- */
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c;
  if(h!==undefined)e.innerHTML=h; return e;};
const ROLE = {'ابتداء':'ibtida','تفريق':'tafriq','توسّع':'tawassu','رجوع':'rujuu','ضغط':'daght'};
const ROLE_EN = {'ابتداء':'ibtidāʾ · present the anchor','تفريق':'tafrīq · separate',
  'توسّع':'tawassuʿ · reach outward','رجوع':'rujūʿ · return','ضغط':'ḍaghṭ · compress',
  'وقف':'waqf · the marker\u2019s stop','فصل':'faṣl · separate','حمل':'ḥaml · carry across',
  'عكس':'ʿaks · reverse attachment','وصل':'waṣl · stitch','جمع':'jamʿ · union of clusters',
  'إحاطة':'iḥāṭah · enclose','إسقاط':'isqāṭ · omission — مقام التوجيه only'};

function renderRetlah(role, r){
  const d = el('div','retl r-'+(ROLE[role]||'x'));
  const g = ROLE_EN[role];
  d.appendChild(el('span','role', g ? role+' &nbsp;·&nbsp; '+g : role));
  d.appendChild(el('div','line q', shc(retlText(r))));
  d.appendChild(el('div','cit', retlCite(r)));
  return d;
}
function renderFurqan(F, i){
  const f = el('section','furqan');
  f.appendChild(el('div','fnum','فُرْقَان '+i));
  const a = el('div','anchor');
  a.appendChild(el('span','lbl','مَحْمِل · anchor'));
  a.appendChild(el('span','t q', shc(span(F.a))));
  a.appendChild(el('span','cit mono', cite(F.a)));
  f.appendChild(a);
  if (F.e && F.e.length){
    const es = el('div','edges');
    const seen = new Set();
    F.e.forEach(([name,ev,bits,ty])=>{
      if (seen.has(name+ev)) return; seen.add(name+ev);
      const e = el('div','edge');
      e.appendChild(el('span','k', name));
      e.appendChild(el('span','mono', ev));
      const b = el('span','bar'); b.style.width = Math.max(6, bits*4.4)+'px';
      e.appendChild(b);
      e.appendChild(el('span','bits', bits.toFixed(1)+' bits'));
      e.appendChild(el('span','pill '+(ty==='نصّي'?'p-n':'p-i'), ty));
      es.appendChild(e);
    });
    f.appendChild(es);
  }
  F.r.forEach(([role,r]) => f.appendChild(renderRetlah(role,r)));
  return f;
}

/* ---------- مَجْرَى الرَّتْل — the stream ---------- */
const stream = document.getElementById('stream');
let CUR = null;

function head(titleAr, sub, meta){
  const h = el('div','shead');
  h.appendChild(el('h2','',titleAr));
  if (sub) h.appendChild(el('p','sub',sub));
  if (meta){ const m = el('div','meta'); meta.forEach(x=>m.appendChild(el('span','',x))); h.appendChild(m); }
  return h;
}

function flow(title, sub, meta, furqans, contFrom){
  stream.textContent=''; stream.scrollTop=0;
  stream.appendChild(head(title, sub, meta));
  const body = el('div'); stream.appendChild(body);
  let i = 1, pool = furqans.slice();
  const seenSurah = new Set(contFrom||[]);
  function paint(list){ list.forEach(F=>body.appendChild(renderFurqan(F,i++))); }
  paint(pool);
  /* continuation: follow a reached coordinate into that sūrah's own ترتيل.
     Grounded by construction — every continuation begins where the walk already arrived. */
  const btn = el('button','more','واصِل · continue the walk');
  btn.onclick = ()=>{
    const last = pool[pool.length-1];
    let next = null;
    const reach = [];
    (last?last.r:[]).forEach(([,r])=>r.forEach(sp=>reach.push(sp[0])));
    for (const s of reach){ if(!seenSurah.has(s)){ next = s; break; } }
    if (next===null){ for(let s=1;s<=114;s++) if(!seenSurah.has(s)){ next=s; break; } }
    if (next===null){ btn.textContent='انتهى المَجْرَى · the walk is exhausted'; btn.disabled=true; return; }
    seenSurah.add(next);
    const add = (D.maratil[String(next)]||[]).slice(0,2);
    if (!add.length){ btn.click(); return; }
    body.appendChild(el('div','fnum','⟶ '+D.names[next-1][0]+' · '+D.names[next-1][1]));
    paint(add); pool = add;
    btn.scrollIntoView({block:'nearest', behavior:'smooth'});
  };
  stream.appendChild(btn);
  stream.appendChild(el('p','note','كلُّ لفظٍ في التِّلاوةِ مُسنَدٌ إلى مَوضِعٍ في النَّص. Every token above carries its coordinate; nothing is composed that cannot be cited.'));
}

/* ---------- surah reader with the waqf layer live ---------- */
function readSurah(n){
  stream.textContent=''; stream.scrollTop=0;
  const [ar,en] = D.names[n-1];
  const vs = D.text[n-1];
  stream.appendChild(head(ar, null, [en, 'سُورَة '+n, vs.length+' آية',
    'الوَقْف · '+countMarks(n)+' marks']));
  const t = D.maratil[String(n)]||[];
  if (t.length){
    const b = el('button','more','افتَح التَّرْتِيل · open this sūrah\'s ترتيل');
    b.onclick = ()=> flow(ar, en, ['مَرَاتِل'], t, [n]);
    stream.appendChild(b);
  }
  const R = el('div','reader');
  vs.forEach((v,i)=>{
    const row = el('div','vrow');
    row.appendChild(el('div','vnum', (i+1)));
    const tx = el('div','vtext q');
    tx.appendChild(markup(v, n, i+1));
    row.appendChild(tx); R.appendChild(row);
  });
  stream.appendChild(R);
  stream.appendChild(el('p','note','الوقفُ طبقةٌ لاحقة، لا من الرَّسْم. The pause marks are a later layer, not part of the rasm — tap any one to open the ترتيل its boundary generates. Toggle الرَّسْم above to read the codex without them.'));
}
function countMarks(n){
  let c=0; (D.text[n-1]||[]).forEach(v=>{ const m=v.match(WQ_RE); if(m)c+=m.length; }); return c;
}
function markup(v, s, a){
  const frag = document.createDocumentFragment();
  if (RASM){ frag.appendChild(document.createTextNode(toRasm(v))); return frag; }
  /* Waqf marks are combining characters with no advance width, so they cannot be
     targeted alone. The mark belongs to the word it sits on — that word is the target. */
  const toks = v.replace(/۞/g,'').split(/\s+/).filter(Boolean);
  toks.forEach((tok,i)=>{
    if (i) frag.appendChild(document.createTextNode(' '));
    const m = tok.match(WQ_RE);
    if (m){
      const sp = el('span','wq', tok);
      sp.setAttribute('role','button'); sp.tabIndex = 0;
      sp.title = ((WAQF[m[0]]||{}).en || 'waqf') + ' — open the composition';
      sp.setAttribute('aria-label','waqf mark on word '+(i+1)+' — open composition');
      const go = ()=> openWaqf(m[0], s, a, i+1);
      sp.onclick = go;
      sp.onkeydown = ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); go(); } };
      frag.appendChild(sp);
    } else {
      frag.appendChild(document.createTextNode(tok));
    }
  });
  return frag;
}

/* ---------- the waqf composition sheet ---------- */
const sheet = document.getElementById('sheet'), sheetin = document.getElementById('sheetin');
document.getElementById('sheetx').onclick = ()=> sheet.hidden = true;
function openWaqf(mark, s, a, wi){
  const info = WAQF[mark] || {ar:'وَقْف', en:'pause', rule:''};
  const wAll = words(s,a).length;
  const bad  = BAD.has(s+':'+a);
  const spA  = bad ? null : [s,a,1,wi];
  const spB  = (bad || wi>=wAll) ? null : [s,a,wi+1,wAll];
  const nextA = (D.text[s-1]||[])[a] ? [s,a+1,1,Math.min(3,words(s,a+1).length)] : null;

  sheetin.textContent='';
  const h = el('div','whead');
  h.appendChild(el('span','wmark', mark));
  h.appendChild(el('h3','', info.ar));
  h.appendChild(el('span','pill p-m','سبب منقول'));
  sheetin.appendChild(h);
  sheetin.appendChild(el('p','wrule', info.en + ' — ' + info.rule));

  const secA = el('div'); secA.style.marginTop='20px';
  secA.appendChild(el('div','fnum','١ · كَمَا وُضِعَ — as the marker intended'));
  if (spA) secA.appendChild(renderRetlah('وقف', [spA]));
  if (spB) secA.appendChild(renderRetlah('ابتداء', [spB]));
  if (!spA && !spB) secA.appendChild(el('p','sub q', sh(verse(s,a))));
  sheetin.appendChild(secA);

  const secB = el('div'); secB.style.marginTop='22px';
  secB.appendChild(el('div','fnum','٢ · تَرْتِيلًا — the same boundary, navigated'));
  if (spA && spB){
    secB.appendChild(renderRetlah('فصل', [spA]));
    secB.appendChild(renderRetlah('حمل', [spA, spB]));
    secB.appendChild(renderRetlah('عكس', [spB, spA]));
    if (nextA) secB.appendChild(renderRetlah('توسّع', [spB, nextA]));
    secB.appendChild(renderRetlah('وصل', [spA, spB]));
  } else {
    secB.appendChild(el('p','sub','This verse is one of ten where word division and the morphology disagree; the composition is withheld rather than guessed.'));
  }
  sheetin.appendChild(secB);

  sheetin.appendChild(el('p','attrib',
    '<b>طَبَقَةُ الوَقْف.</b> These marks are not of the rasm. The earliest Uthmānic codices carried no pause marks, no āyah separators, no pointing and no vowels. The apparatus was added by later readers — the system of رموز السجاوندي and those after him — as an aid to reciters, and it was then mass-produced into nearly every printed copy. Here it is treated as what it is in this formalism: <b>a recorded مَسَار</b>, a prior reciter\'s navigational choices, typed <b>سبب منقول</b> — attested by transmission, neither text nor mere perception. The marker\'s judgement is shown first and in full; the ترتيل follows.'));
  sheet.hidden = false;
  sheetin.scrollTop = 0;
}

/* ---------- modes ---------- */
const listEl = document.getElementById('list');
const MODES = [
  {k:'maratil', ar:'مَرَاتِل', en:'By Sūrah'},
  {k:'huruf',   ar:'الحُرُوف الحُكَمَاء', en:'Constellations'},
  {k:'siyar',   ar:'السِّيَر', en:'Narratives'},
  {k:'athar',   ar:'الآثَار', en:'Techniques'}
];

/* الآثَار — the operator demonstrations, drawn from the Furqāns that discovered them */
const ATHAR = [
 {op:'الحَمْل', en:'carry', g:'hamal(a,b) → [a,b]',
  d:'A coordinate survives the stop and orients the next beginning. الٓمٓ opens six sūrahs; carrying it reaches a different destination each time.',
  r:[['ابتداء',[[30,1,1,1]]],['حمل',[[30,1,1,1],[2,2,1,2]]],['حمل',[[30,1,1,1],[31,2,1,2]]],['حمل',[[30,1,1,1],[32,2,1,2]]],['حمل',[[30,1,1,1],[30,2,1,2]]]]},
 {op:'الفَصْل', en:'separate', g:'fasl(span,at) → span,span',
  d:'Cutting a familiar continuous expression makes its internal architecture perceptible. الفصلُ يجعلُ الوصلَ قابلًا للاكتشاف.',
  r:[['ابتداء',[[2,2,1,2]]],['فصل',[[2,2,2,2],[2,2,3,4]]],['فصل',[[2,2,3,4]]],['وصل',[[2,1,1,1],[2,2,1,6]]]]},
 {op:'العَكْس', en:'reverse', g:'aks(r) → reversed(r)',
  d:'Attachment reversed inside one verse — no movement in the muṣḥaf at all. An opening heard as a destination.',
  r:[['ابتداء',[[12,1,1,5]]],['عكس',[[12,1,2,5],[12,1,1,1]]],['عكس',[[12,1,2,3],[12,1,1,1]]],['رجوع',[[12,1,1,5]]]]},
 {op:'الضَّغْط', en:'compress', g:'daght(path) → [first,last]',
  d:'A whole traversal reduced to its two endpoints, so the configuration can be carried as one node.',
  r:[['ابتداء',[[30,1,1,1],[30,2,1,2]]],['ضغط',[[30,2,1,2],[30,1,1,1]]],['ضغط',[[30,1,1,1],[30,3,1,3]]]]},
 {op:'الإحَاطَة', en:'enclose', g:'ihata(r,sp) → [sp,…r,sp]',
  d:'Repetition functioning as a boundary. The repeated phrase becomes an edge that encloses what sits between.',
  r:[['ابتداء',[[30,2,1,2],[30,3,1,3]]],['إحاطة',[[30,3,1,3],[30,2,1,2],[30,3,1,3]]],['إحاطة',[[30,3,1,3],[30,3,4,4],[30,3,1,3]]]]},
 {op:'الجَمْع', en:'union', g:'jam(c₁,c₂) → cluster | ∅',
  d:'Union of two letter-clusters — admissible only where the union is itself attested. Of 91 pairs, exactly two are.',
  r:[['ابتداء',[[30,1,1,1]]],['جمع',[[12,1,1,1],[13,1,1,1]]],['جمع',[[13,1,1,4],[30,1,1,1]]],['جمع',[[7,1,1,1],[30,1,1,1]]]]},
 {op:'الإسْقَاط', en:'omission', g:'isqat(sp,w,mode) — مقام التوجيه only',
  d:'The one operation that subtracts. Dropping لَا re-scopes what remains — admissible as an orienting declaration to oneself, never as a reading of the text.',
  r:[['ابتداء',[[2,2,1,6]]],['إسقاط',[[2,2,4,4],[2,2,5,6]]],['رجوع',[[2,2,3,6]]],['وصل',[[2,1,1,1],[2,2,1,6]]]]},
 {op:'الوَصْل', en:'stitch', g:'wasl(r₁,r₂) → r',
  d:'Two separated coordinates brought into one navigational event. The bridge that closes the al-Rūm / al-Raʿd circuit.',
  r:[['ابتداء',[[30,4,4,5]]],['وصل',[[30,4,4,9]]],['توسّع',[[30,4,4,5],[13,31,16,18]]],['رجوع',[[13,31,16,18],[30,4,4,9]]]]}
];

function buildList(mode){
  listEl.textContent='';
  if (mode==='maratil'){
    listEl.appendChild(el('p','lhead','١١٤ سُورَة'));
    const g = el('div','grid');
    D.names.forEach(([ar,en],i)=>{
      const b = el('button','item');
      b.appendChild(el('span','n', i+1));
      b.appendChild(el('span','a', ar));
      b.onclick = ()=>{ sel(b); readSurah(i+1); };
      g.appendChild(b);
    });
    listEl.appendChild(g);
  } else if (mode==='huruf'){
    listEl.appendChild(el('p','lhead','أَرْبَعُ كَوْكَبَات'));
    D.huruf.forEach((c,i)=>{
      const b = el('button','item');
      b.appendChild(el('span','n', i+1));
      b.appendChild(el('span','a', c.ar));
      b.appendChild(el('span','m', c.suras.length));
      b.onclick = ()=>{ sel(b);
        flow(c.ar, c.note, [c.en, c.sub, 'سُوَر: '+c.suras.join(' · ')], c.t, c.suras); };
      listEl.appendChild(b);
    });
  } else if (mode==='siyar'){
    listEl.appendChild(el('p','lhead','بَذْرَةُ الاسْمِ وَحْدَه'));
    D.siyar.forEach((p,i)=>{
      const b = el('button','item');
      b.appendChild(el('span','n', i+1));
      b.appendChild(el('span','a', p.ar));
      b.appendChild(el('span','m', p.n));
      b.onclick = ()=>{ sel(b);
        flow(p.ar, 'Seeded on the name-lemma alone — every further coordinate had to be reached by a typed, weighted edge, so the قِصَّة is found rather than supplied.',
             [p.tr, p.n+' occurrences', p.suras.length+' sūrahs'], p.t, p.suras); };
      listEl.appendChild(b);
    });
  } else {
    listEl.appendChild(el('p','lhead','ثَمَانِيَةُ أَعْمَال'));
    ATHAR.forEach((a,i)=>{
      const b = el('button','item');
      b.appendChild(el('span','n', i+1));
      b.appendChild(el('span','a', a.op));
      b.onclick = ()=>{ sel(b);
        stream.textContent='';
        stream.appendChild(head(a.op, a.d, [a.en, a.g]));
        const f = el('section','furqan');
        a.r.forEach(([role,r]) => f.appendChild(renderRetlah(role, r)));
        stream.appendChild(f);
        stream.appendChild(el('p','note','مِن الفُرْقَانَاتِ الَّتِي اكْتَشَفَتْها. Each demonstration is the traversal in which this operation was first performed, rendered from its citations.'));
      };
      listEl.appendChild(b);
    });
  }
  const first = listEl.querySelector('.item');
  if (first) first.click();
}
function sel(b){
  listEl.querySelectorAll('.item').forEach(x=>x.removeAttribute('aria-current'));
  b.setAttribute('aria-current','true');
}

/* ---------- rail ---------- */
const rail = document.getElementById('rail');
MODES.forEach((m,i)=>{
  const b = el('button');
  b.setAttribute('role','tab');
  b.innerHTML = '<span class="a">'+m.ar+'</span><span class="e">'+m.en+'</span>';
  b.onclick = ()=>{
    rail.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected','false'));
    b.setAttribute('aria-selected','true');
    CUR = m.k; buildList(m.k);
  };
  rail.appendChild(b);
  if (i===1) setTimeout(()=>b.click(),0);   /* open on the constellations */
});

/* ---------- controls ---------- */
document.getElementById('rasm').onclick = function(){
  RASM = !RASM; this.setAttribute('aria-pressed', RASM);
  const cur = listEl.querySelector('[aria-current="true"]');
  if (cur) cur.click();
};
document.getElementById('theme').onclick = function(){
  const r = document.documentElement;
  const dark = r.getAttribute('data-theme')==='dark' ||
    (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
  r.setAttribute('data-theme', dark ? 'light' : 'dark');
};
addEventListener('keydown', e=>{ if(e.key==='Escape') sheet.hidden = true; });
})();
</script>
